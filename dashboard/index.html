<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ansa POC — Synthesis Orders</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Synthesis Orders</h1>
  <p class="tagline">DNA synthesis order &amp; fulfillment pipeline — Experience API, Process API, Salesforce, and instrument telemetry, live.</p>

  <form id="order-form">
    <label>Sequence <input name="sequence" required placeholder="ACGT..."></label>
    <label>Account ID <input name="accountId" required></label>
    <label>Requested Ship Date <input name="requestedShipDate" type="date" required></label>
    <button type="submit">Submit Order</button>
  </form>
  <p id="submit-result"></p>

  <div class="layout">
    <div id="orders-container" class="orders-container"></div>

    <section class="event-feed">
      <h2>Pipeline Activity</h2>
      <ul id="event-feed-list"><li class="event-empty">No activity yet.</li></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
