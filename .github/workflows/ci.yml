name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [feasibility, sfdc-auth, instrument-simulator]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest
        env:
          PYTHONPATH: .

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node --test tests/app.test.js tests/stomp-client.test.js
