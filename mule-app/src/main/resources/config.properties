# Safe, non-secret local/test defaults for global-config.xml's property
# placeholders. Real Salesforce credentials and keystore material stay in
# the gitignored top-level .env and are expected to reach the runtime as
# JVM system properties (-M-Dkey=value) at deployment time -- system
# properties take precedence over these file-based values in Mule 4.
#
# See docs/decisions or Task 12's docker-entrypoint.sh for the env-var ->
# system-property mapping used in the real deployment.

# HTTP listener/request ports and hosts
sf.system.api.port=8082
sf.system.api.host=localhost
feasibility.system.api.port=8083
feasibility.system.api.host=localhost
process.api.port=8084
experience.api.port=8081
feasibility.host=feasibility
feasibility.port=5001

# Salesforce REST API via OAuth 2.0 JWT Bearer (dummy values -- overridden
# by real system properties at deploy time; MUnit tests mock java:invoke and
# every http:request call so neither JwtSigner nor the real org is ever
# touched during `mvn test`)
sfdc.instance.host=login.salesforce.com
sfdc.consumer.key=changeme-consumer-key
sfdc.username=changeme@example.com
sfdc.jwt.keystore.path=keys/sfdc-jwt.p12
sfdc.jwt.keystore.password=changeme-keystore-password
sfdc.jwt.key.alias=sfdc-jwt
sfdc.jwt.audience=https://login.salesforce.com

# ActiveMQ
activemq.broker.url=tcp://localhost:61616
