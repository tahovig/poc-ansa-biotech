services:
  activemq:
    image: apache/activemq-artemis:2.37.0
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    volumes:
      - ./activemq/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    ports:
      - "8161:8161"
      - "61616:61616"
      - "61613:61613"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8161 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  feasibility:
    image: ghcr.io/tahovig/poc-ansa-biotech/feasibility:latest
    ports:
      - "5001:5001"

  sfdc-auth:
    image: ghcr.io/tahovig/poc-ansa-biotech/sfdc-auth:latest
    env_file: .env
    environment:
      SFDC_JWT_PRIVATE_KEY_PATH: /app/keys/sfdc-jwt.key
    volumes:
      - ./keys/sfdc-jwt.key:/app/keys/sfdc-jwt.key:ro
    # No host port mapping: only mule-app calls this, over the compose
    # network, and it hands out live Salesforce access tokens on request.

  mule-app:
    image: ghcr.io/tahovig/poc-ansa-biotech/mule-app:latest
    env_file: .env
    depends_on:
      activemq:
        condition: service_healthy
      feasibility:
        condition: service_started
      sfdc-auth:
        condition: service_started
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"

  instrument-simulator:
    image: ghcr.io/tahovig/poc-ansa-biotech/instrument-simulator:latest
    env_file: .env
    environment:
      ACTIVEMQ_STOMP_HOST: activemq
      ACTIVEMQ_STOMP_PORT: "61613"
      SIMULATOR_TICK_SECONDS: "2"
    depends_on:
      activemq:
        condition: service_healthy

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: python -m http.server 8090
    ports:
      - "8090:8090"
    depends_on:
      - mule-app
