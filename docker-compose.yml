services:
  activemq:
    image: apache/activemq-artemis:2.37.0
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    ports:
      - "8161:8161"
      - "61616:61616"
      - "61613:61613"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8161 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  feasibility:
    build: ./services/feasibility
    ports:
      - "5001:5001"

  sfdc-auth:
    build: ./services/sfdc-auth
    env_file: .env
    environment:
      SFDC_JWT_PRIVATE_KEY_PATH: /app/keys/sfdc-jwt.key
    volumes:
      - ./mule-app/src/main/resources/keys/sfdc-jwt.key:/app/keys/sfdc-jwt.key:ro
    ports:
      - "5002:5002"

  mule-app:
    build: ./mule-app
    env_file: .env
    depends_on:
      activemq:
        condition: service_healthy
      feasibility:
        condition: service_started
      sfdc-auth:
        condition: service_started
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"

  instrument-simulator:
    build: ./services/instrument-simulator
    environment:
      ACTIVEMQ_STOMP_HOST: activemq
      ACTIVEMQ_STOMP_PORT: "61613"
      SIMULATOR_TICK_SECONDS: "2"
    depends_on:
      activemq:
        condition: service_healthy

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: python -m http.server 8090
    ports:
      - "8090:8090"
    depends_on:
      - mule-app
